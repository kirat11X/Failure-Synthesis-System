[project]
name = "fss-py"
version = "0.1.0"
description = "Failure Synthesis System - deterministic decoding and evidence layer (P1)"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
